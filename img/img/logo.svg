<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="340" height="85">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge (opcional transparente) -->
  <g transform="translate(10, 10)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
    <path d="M20 45 L32 20 L44 45 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="32" cy="35" r="5" fill="#ffffff"/>
  </g>
  <!-- Brand Text -->
  <text x="86" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="1" fill="#ffffff">
    STUDIO<tspan fill="#38bdf8">.PRO</tspan>
  </text>
  <text x="88" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#cbd5e1">
    CREATIVE PORTFOLIO
  </text>
</svg>